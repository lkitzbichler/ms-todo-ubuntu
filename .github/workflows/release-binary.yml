name: Release binary (.deb) — atomic

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # Releases erstellen/löschen

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      # Build only (kein auto-publish von electron-builder)
      - name: Build .deb
        run: npx electron-builder --linux deb --publish never

      - name: Checksums
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS.txt
          ls -lh

      - name: Compute vars
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "DEB_PATH=$(echo dist/*.deb)" >> $GITHUB_ENV
          echo "DEB_NAME=$(basename dist/*.deb)" >> $GITHUB_ENV
          echo "TAG=$GITHUB_REF_NAME  DEB=$(basename dist/*.deb)"

      # Falls ein Release mit dem Tag schon existiert (immutable) -> weg damit
      - name: Delete release if exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" -y || true

      # ATOMAR: Release erstellen UND Dateien sofort anhängen (keine späteren Uploads)
      - name: Create published release WITH assets (atomic)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            "$DEB_PATH" dist/SHA256SUMS.txt \
            --title "$TAG" \
            --generate-notes \
            --latest
