name: Release binary (.deb)

on:
  push:
    tags:
      - "v*"    # z.B. v1.0.8

permissions:
  contents: write  # nötig für Release-Erstellung/Upload/Löschen

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # electron-builder baut, published NICHT selbst
      - name: Build .deb
        run: npx electron-builder --linux deb --publish never

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS.txt
          ls -lh

      - name: Compute artifact names
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          echo "DEB_PATH=$(echo dist/*.deb)" >> $GITHUB_ENV
          echo "DEB_NAME=$(basename dist/*.deb)" >> $GITHUB_ENV
          echo "Computed: TAG=$GITHUB_REF_NAME VERSION=${GITHUB_REF_NAME#v} DEB_NAME=$(basename dist/*.deb)"

      # ---- Release robust behandeln: löschen (falls kaputt/immutable), neu als Draft anlegen, uploaden, veröffentlichen ----
      - name: Ensure clean release (delete if exists)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Löschen, falls vorhanden (z. B. immutable kaputter Release)
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" -y || true

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --draft

      - name: Upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" \
            "$DEB_PATH" dist/SHA256SUMS.txt \
            --clobber

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$TAG" --draft=false
