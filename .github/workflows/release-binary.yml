name: Release binary (.deb)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # nötig für Release-Erstellung/Upload

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build .deb (no publish)
        run: npx electron-builder --linux deb --publish never

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS.txt
          ls -lh

      - name: Compute artifact names
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          echo "DEB_PATH=$(echo dist/*.deb)" >> $GITHUB_ENV
          echo "DEB_NAME=$(basename dist/*.deb)" >> $GITHUB_ENV
          echo "Computed: TAG=$GITHUB_REF_NAME VERSION=${GITHUB_REF_NAME#v} DEB_NAME=$(basename dist/*.deb)"

      # Release existiert? -> nutzen; sonst NEU & bereits veröffentlicht anlegen (kein Draft!)
      - name: Ensure published release exists (no draft/edit)
        id: ensure_release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.TAG || context.ref.replace('refs/tags/','');
            const { owner, repo } = context.repo;
            try {
              const rel = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release ${tag} exists (id=${rel.data.id}).`);
              core.setOutput('upload_url', rel.data.upload_url);
            } catch (e) {
              if (e.status !== 404) throw e;
              const rel = await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                name: tag,
                generate_release_notes: true,
                draft: false,
                prerelease: false
              });
              core.info(`Created published release ${tag} (id=${rel.data.id}).`);
              core.setOutput('upload_url', rel.data.upload_url);
            }

      # Assets hochladen (überschreiben, falls vorhanden) – KEIN edit/publish mehr!
      - name: Upload .deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" "$DEB_PATH" --clobber

      - name: Upload checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" dist/SHA256SUMS.txt --clobber
