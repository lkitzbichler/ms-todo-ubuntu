name: Release binary (.deb)

on:
  push:
    tags:
      - "v*"    # z.B. v1.0.6

permissions:
  contents: write  # nötig für Release-Erstellung/Upload

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # electron-builder baut, published NICHT selbst
      - name: Build .deb
        run: npx electron-builder --linux deb --publish never

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS.txt
          ls -lh

      # Dateinamen/Version ermitteln und als Env-Variablen exportieren
      - name: Compute artifact names
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          # Version ohne führendes v (z.B. v1.0.6 -> 1.0.6)
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          # Ermitteltes .deb (wir haben genau eins)
          echo "DEB_PATH=$(echo dist/*.deb)" >> $GITHUB_ENV
          echo "DEB_NAME=$(basename dist/*.deb)" >> $GITHUB_ENV
          echo "Computed -> TAG=$GITHUB_REF_NAME, VERSION=${GITHUB_REF_NAME#v}, DEB_NAME=$(basename dist/*.deb)"

      # Release automatisch anlegen, falls er noch nicht existiert
      - name: Ensure release exists (create if missing)
        id: ensure_release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.TAG;
            const { owner, repo } = context.repo;
            try {
              const rel = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release ${tag} exists (id=${rel.data.id}).`);
              core.setOutput('id', String(rel.data.id));
              core.setOutput('upload_url', rel.data.upload_url);
            } catch (e) {
              if (e.status !== 404) throw e;
              const rel = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: tag, generate_release_notes: true
              });
              core.info(`Created release ${tag} (id=${rel.data.id}).`);
              core.setOutput('id', String(rel.data.id));
              core.setOutput('upload_url', rel.data.upload_url);
            }

      # Assets hochladen — ohne Release-Metadaten zu ändern
      - name: Upload .deb
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.ensure_release.outputs.upload_url }}
          asset_path: ${{ env.DEB_PATH }}
          asset_name: ${{ env.DEB_NAME }}
          asset_content_type: application/vnd.debian.binary-package

      - name: Upload checksums
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.ensure_release.outputs.upload_url }}
          asset_path: dist/SHA256SUMS.txt
          asset_name: SHA256SUMS.txt
          asset_content_type: text/plain
