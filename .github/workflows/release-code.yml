name: Release code-only
on:
  push:
    tags: ["src-*"]
permissions:
  contents: write
jobs:
  code-only:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
