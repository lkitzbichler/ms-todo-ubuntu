name: Build & Publish via electron-builder

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 || true

      - name: Install dependencies
        run: npm ci

      # electron-builder erkennt Tag und published SELBST
      - name: Build & Publish
        run: npx electron-builder --linux deb
        # oder: npx electron-builder --linux deb AppImage
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
