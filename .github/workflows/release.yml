name: Build & Release (Linux)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # erlaubt Release-Upload

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install system deps (AppImage runtime optional)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 || true

      - name: Install dependencies
        run: npm ci

      # electron-builder nur bauen lassen, NICHT publishen
      - name: Build artifacts (.deb + AppImage)
        run: npx electron-builder --linux deb AppImage --publish never

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.deb  > SHA256SUMS.txt || true
          sha256sum *.AppImage >> SHA256SUMS.txt || true
          ls -lh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
