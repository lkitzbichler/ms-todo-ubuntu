name: Build & Release (Linux .deb)

on:
  push:
    tags:
      - "v*"  # z.B. v1.0.1

permissions:
  contents: write  # erlaubt Upload an Release

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install system deps (AppImage runtime, optional)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 || true

      - name: Install deps
        run: npm ci

      # Baue .deb (und optional AppImage – Zeile drunter auskommentieren)
      - name: Build
        run: npx electron-builder --linux deb
        # run: npx electron-builder --linux deb AppImage

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
