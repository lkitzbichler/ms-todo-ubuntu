<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TODO</title>
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' https: data:;">
    <style>
      html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; }
      .titlebar { -webkit-app-region: drag; position:absolute; top:0; left:0; right:0; height:28px; background:#111; }
      .content  { height: 100%; width: 100%; -webkit-app-region: no-drag; position:absolute; top:28px; left:0; right:0; bottom:0; }
      #wv { display:block; width:100%; height:100%; border:0; }
    </style>
  </head>
  <body>
    <div class="titlebar"></div>
    <div class="content">
      <!-- allowpopups erlaubt Login-/Popup-Fenster, partition sorgt für persistente Cookies/Logins -->
      <webview id="wv" partition="persist:kiosk" allowpopups></webview>
    </div>
    <script>
      const TARGET_URL = "https://to-do.live.com/tasks/today";
      const wv = document.getElementById('wv');
      wv.src = TARGET_URL;

      // Optional: DevTools fürs Webview
      // wv.addEventListener('dom-ready', () => wv.openDevTools());
    </script>
  </body>
</html>
